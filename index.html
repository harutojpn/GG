<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>アルディアの伝説 〜緑衣の勇者〜</title>
<meta name="description" content="幻想の大地アルディアを冒険するフル3Dオープンフィールドアクション。ゼルダの伝説へのオマージュ作品。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 起動スプラッシュ(main.js が管理。ui.js のスタイルとは独立) */
  #boot {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(ellipse at 50% 40%, #101c22 0%, #05090c 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; transition: opacity .8s ease; color: #cfe3d8;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  #boot.boot-done { opacity: 0; pointer-events: none; }
  #boot .boot-mark {
    width: 74px; height: 74px; position: relative;
    animation: bootspin 6s linear infinite;
  }
  #boot .boot-mark::before {
    content: ''; position: absolute; inset: 0;
    background: conic-gradient(from 0deg, transparent 0 40%, #33e0c8 50%, transparent 60% 100%);
    -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
            mask: radial-gradient(circle, transparent 55%, #000 56%);
    border-radius: 50%;
  }
  #boot .boot-mark::after {
    content: '◆'; position: absolute; inset: 0; display: grid; place-items: center;
    color: #c9a227; font-size: 26px; text-shadow: 0 0 18px rgba(201,162,39,.8);
  }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  #boot h1 { font-size: 15px; letter-spacing: .55em; text-indent: .55em; font-weight: 400; color: #9fb8ac; }
  #boot-status { font-size: 12px; letter-spacing: .3em; color: #5f7a70; min-height: 1.2em; }
  #boot-track { width: 210px; height: 1px; background: rgba(255,255,255,.12); overflow: hidden; }
  #boot-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #33e0c8, #c9a227); transition: width .5s ease; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-root"></div>
<div id="boot">
  <div class="boot-mark"></div>
  <h1>アルディアの伝説</h1>
  <div id="boot-track"><div id="boot-bar"></div></div>
  <div id="boot-status">目覚めの刻…</div>
</div>
<script src="dist/game.js"></script>
</body>
</html>
